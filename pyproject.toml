[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsealpha"
version = "0.1.0"
description = "Cross-sectional alpha research on NSE equities: signals, IC analysis, walk-forward models, market-neutral backtest"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.1", "scipy", "scikit-learn", "matplotlib", "pyarrow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
